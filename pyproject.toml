[project]
name = "pii-mask-enhanced"
version = "0.1.0"
description = "Локальный шлюз маскировки ПД перед отправкой текста в облачные LLM (mask/unmask, stateless mapping)"
requires-python = ">=3.10"
dependencies = [
    "natasha>=1.6",
    "setuptools<81",  # pymorphy2 (зависимость natasha) требует pkg_resources, из 81+ он удален
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# конвертация .doc через MS Word, если нет LibreOffice (только Windows)
word = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
pii-mask = "pii_mask_enhanced.interfaces.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pii_mask_enhanced*"]

[tool.pytest.ini_options]
# предупреждение от pymorphy2, что глушится в ner.py
filterwarnings = ["ignore:pkg_resources is deprecated:UserWarning"]
